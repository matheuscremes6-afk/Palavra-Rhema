<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080C">
<title>Palavra Rhema</title>
<style>
:root{--bg:#08080C;--side:#0A0A0F;--card:#0D0D13;--card2:#13131B;--line:#22222C;--line2:#2E2E3A;--text:#F4F4F6;--muted:#8E909C;--blue:#9EC5FF;--pink:#FFB4C8;--green:#A8E6BE;--yellow:#FFE08A;--lilac:#C9B6FF;--danger:#FF9FA8;--r:18px;--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color-scheme:dark}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;padding:6px 12px 20px}
.brand b{background:linear-gradient(90deg,var(--blue),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--muted);font-size:.96rem;text-align:left;width:100%;transition:.15s}
.nav:hover{color:var(--text)}.nav.on{background:#171720;color:var(--text)}
main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,8,12,.92);backdrop-filter:blur(8px);z-index:5}
.top h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.page{padding:24px 28px 40px;display:grid;gap:16px;max-width:1200px;align-content:start}
.white{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;background:#fff;color:#0B0B10;font-weight:600;font-size:.92rem;white-space:nowrap;transition:.15s}
.white:hover{background:#e8e8ee}.white:disabled{background:var(--card2);color:var(--muted)}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;border:1px solid var(--line2);color:var(--text);font-size:.88rem;white-space:nowrap;text-decoration:none}
.ghost:hover{border-color:var(--blue)}
.btn-i{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.btn-i:hover{color:var(--text);background:var(--line)}
.btn-danger{padding:9px 15px;border-radius:12px;border:1px solid rgba(255,159,168,.4);color:var(--danger);font-size:.88rem}
.cancel{height:42px;padding:0 16px;border-radius:13px;border:1px solid var(--line2);color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:1.05rem;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{--c:var(--blue);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:18px;display:grid;gap:8px}
.stat span{color:var(--muted);font-size:.85rem}.stat b{font-size:1.9rem;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.empty{text-align:center;padding:30px 12px;color:var(--muted);line-height:1.6}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{padding:9px 15px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-size:.9rem}
.tab.on{background:#171720;color:var(--text);border-color:var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line2);font-size:.85rem;color:var(--muted)}
.chip.on{background:rgba(158,197,255,.15);border-color:var(--blue);color:var(--blue)}
.bd{font-size:.72rem;padding:3px 9px;border-radius:99px;background:var(--line2);white-space:nowrap;color:var(--text)}
.bd.blu{background:rgba(158,197,255,.16);color:var(--blue)}.bd.pnk{background:rgba(255,180,200,.16);color:var(--pink)}
.bd.grn{background:rgba(168,230,190,.16);color:var(--green)}.bd.yel{background:rgba(255,224,138,.16);color:var(--yellow)}
.bd.lil{background:rgba(201,182,255,.16);color:var(--lilac)}
.flt{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px}
.flt .field{padding:10px 12px;font-size:.88rem}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.row:hover{border-color:var(--line2)}.row.nc{cursor:default}
.who{flex:1;min-width:0}.who strong{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:.82rem}
.fav.on{color:var(--yellow)}.fav.on svg{fill:currentColor}
.field{width:100%;padding:12px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:.95rem}
.field:focus{outline:none;border-color:var(--blue)}
textarea.field{resize:vertical;font-family:inherit}
.fg{display:grid;gap:6px;margin-bottom:12px}.fl{font-size:.82rem;color:var(--muted)}
.ck{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:.92rem}
.err{min-height:20px;margin:6px 0;font-size:.85rem;color:var(--danger)}
dialog{margin:auto;border:1px solid var(--line2);border-radius:22px;background:var(--card);color:var(--text);padding:24px;width:min(94vw,460px)}
dialog.big{width:min(94vw,760px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.68);backdrop-filter:blur(3px)}
dialog h3{font-size:1.15rem;margin-bottom:14px}
#fBody{max-height:62vh;overflow-y:auto;padding-right:4px}
.dl{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.cifra{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:55vh;margin:8px 0}
.cifra.ltr{white-space:pre-wrap;font-family:inherit;font-size:.95rem}
.ch{color:var(--yellow);font-weight:700}
.sd-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.sd-h h3{margin:0}.sd-h small{color:var(--muted)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cw{text-align:center;color:var(--muted);font-size:.78rem;padding:4px}
.cd{min-height:80px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left}
.cd.emp{border:0;background:none}.cd.today{border-color:var(--blue)}.cd b{font-size:.82rem;color:var(--muted)}
.ev{font-style:normal;font-size:.7rem;padding:2px 7px;border-radius:99px;background:var(--line2)}
.ev.virtual{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.ev.rascunho{background:rgba(255,224,138,.2);color:var(--yellow)}.ev.finalizada{background:rgba(158,197,255,.2);color:var(--blue)}
.ev.realizada{background:rgba(168,230,190,.2);color:var(--green)}.ev.cancelada{background:rgba(255,180,200,.15);color:var(--pink);text-decoration:line-through}
.eh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.eh small{color:var(--muted);display:block;margin-top:2px}
.slot{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px;display:grid;gap:12px}
.sl-h{display:flex;align-items:center;gap:10px}.sl-h strong{flex:1}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mi{display:grid;gap:4px;font-size:.78rem;color:var(--muted)}.mi .field{padding:9px 10px;font-size:.88rem}
.warn{color:var(--yellow);font-size:.82rem;line-height:1.45}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem;margin-bottom:10px}
.bar .bi{grid-column:1/-1;height:6px;border-radius:9px;background:var(--card2);overflow:hidden}.bar .bi i{display:block;height:100%;background:var(--blue);border-radius:9px}
details{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details summary{cursor:pointer;font-weight:600}details p{color:var(--muted);font-size:.88rem;margin-top:6px}
.sk{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-size:.9rem;box-shadow:0 12px 32px rgba(0,0,0,.55);transition:.25s;max-width:92vw;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
#auth{display:none;min-height:100vh;place-items:center;padding:20px}
body.locked #auth{display:grid}
body.boot #auth,body.locked .app,body.locked .bottom,body.boot .app,body.boot .bottom{display:none}
.auth-card{width:min(92vw,380px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;gap:14px}
.auth-card .brand{padding:0}.auth-card p{color:var(--muted);font-size:.9rem;line-height:1.45}
.auth-card .white{justify-content:center;width:100%}
.bottom{display:none}
@media(max-width:1000px){.flt{grid-template-columns:1fr 1fr}.flt .field:first-child{grid-column:1/-1}}
@media(max-width:820px){
  .app{display:block}aside{display:none}
  .top{padding:12px 14px}.top h2{font-size:1.25rem}.page{padding:16px 14px 100px}
  .white span{display:none}.white{padding:0 14px}
  .bottom{display:flex;overflow-x:auto;position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,15,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom));z-index:20}
  .bottom .nav{flex-direction:column;gap:3px;font-size:.68rem;padding:8px 10px;min-width:70px;width:auto;align-items:center}
  .cd{min-height:62px;padding:4px}.toast{bottom:90px}
}
</style>

function evs(a,b){
  const out=[],real=S.cultos.filter(c=>c.data>=a&&c.data<=b);
  for(let d=D(a),e=D(b);d<=e;d.setDate(d.getDate()+1)){
    const k=iso(d),w=d.getDay();
    for(const g of S.agenda.filter(g=>g.ativo&&g.dia_semana===w)){
      if(!real.find(c=>c.data===k&&hh(c.hora)===hh(g.hora)&&c.tipo===g.tipo))out.push({data:k,hora:hh(g.hora),tipo:g.tipo,titulo:g.titulo,status:"virtual",id:null});
    }
  }
  real.forEach(c=>out.push({...c,hora:hh(c.hora)}));
  return out.sort((x,y)=>(x.data+x.hora).localeCompare(y.data+y.hora));
}

/* ---- histórico ---- */
async function historico(){
  const from=HP?iso(new Date(Date.now()-HP*864e5)):"2000-01-01";
  const {data}=await chk(T("cultos").select("*").eq("status","realizada").gte("data",from).order("data",{ascending:false}));
  const sc={},cc={},mc={};
  data.filter(c=>c.tipo==="culto").forEach(c=>(c.snapshot||[]).filter(i=>i.musica&&i.cantada!==false).forEach(i=>{sc[i.musica]=(sc[i.musica]||0)+1;(i.cantores||[]).forEach(n=>cc[n]=(cc[n]||0)+1);(i.musicos||[]).forEach(x=>mc[x.nome]=(mc[x.nome]||0)+1)}));
  const top=o=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10),mx=e[0]?e[0][1]:1;return e.length?e.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><b>${v}</b><div class="bi"><i style="width:${v/mx*100}%"></i></div></div>`).join(""):`<div class="empty">Sem dados no período.</div>`};
  const lst=data.map(c=>`<details><summary>${br(c.data)} · ${esc(c.titulo||c.tipo)}</summary>${(c.snapshot||[]).map(i=>`<p>${esc(POS[i.posicao]?POS[i.posicao][0]:i.posicao)}: <b>${esc(i.musica||"—")}</b>${i.tom?" ("+esc(i.tom)+")":""}${i.cantada===false?" — não cantada":""}<br>Cantores: ${esc((i.cantores||[]).join(", ")||"—")} · Músicos: ${esc((i.musicos||[]).map(x=>INS[x.instrumento]+": "+x.nome).join(", ")||"—")}</p>`).join("")||"<p>Sem itens.</p>"}</details>`).join("");
  return {t:"Histórico",a:`<select class="field" style="width:auto" data-hp="1"><option value="90"${HP===90?" selected":""}>Últimos 90 dias</option><option value="365"${HP===365?" selected":""}>Último ano</option><option value="0"${!HP?" selected":""}>Tudo</option></select>`,h:`<div class="grid"><div class="card"><h3>Músicas mais usadas</h3>${top(sc)}</div><div class="card"><h3>Cantores</h3>${top(cc)}</div><div class="card"><h3>Participação dos músicos</h3>${top(mc)}</div></div><div class="card"><h3>Repertórios anteriores</h3><div class="list">${lst||`<div class="empty">Nenhum culto realizado no período.</div>`}</div></div>`};
}

/* ---- escalas ---- */
function escalas(){
  if(C.cur)return editor();
  const y=C.y,m=C.m,first=new Date(y,m,1),last=new Date(y,m+1,0),ev=evs(iso(first),iso(last));let cells="";
  for(let i=0;i<first.getDay();i++)cells+=`<div class="cd emp"></div>`;
  for(let d=1;d<=last.getDate();d++){const k=`${y}-${pad(m+1)}-${pad(d)}`;
    cells+=`<button class="cd${k===TODAY()?" today":""}" data-act="day" data-d="${k}"><b>${d}</b>${ev.filter(e=>e.data===k).map(e=>`<i class="ev ${e.status}">${e.hora}${e.tipo==="ensaio"?" ens.":""}</i>`).join("")}</button>`}
  const mn=first.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  return {t:"Escalas e cultos",a:addBtn("avulso","Avulso"),h:`<div class="card"><div class="calh"><button class="btn-i" data-act="mprev" aria-label="Mês anterior">${ic("l")}</button><strong>${mn}</strong><button class="btn-i" data-act="mnext" aria-label="Próximo mês">${ic("r")}</button></div><div class="cal">${DS.map(x=>`<div class="cw">${x}</div>`).join("")}${cells}</div></div><div class="card"><h3>Legenda</h3><div class="chips"><span class="ev virtual">Sem escala</span><span class="ev rascunho">Rascunho</span><span class="ev finalizada">Finalizada</span><span class="ev realizada">Realizada</span><span class="ev cancelada">Cancelada</span></div></div>`};
}
async function mkCulto(e,status="rascunho"){
  const {data}=await chk(T("cultos").insert({data:e.data,hora:e.hora,tipo:e.tipo,titulo:e.titulo||null,status}).select("id,data,hora,tipo,titulo,status,observacoes").single());
  S.cultos.push(data);
  if(e.tipo==="culto"&&status!=="cancelada")await chk(T("culto_itens").insert(tpl(D(e.data).getDay()).map(p=>({culto_id:data.id,ordem:POS[p][2],posicao:p}))));
  return data;
}

function warns(it){
  const m=byId(S.mus,it.musica_id);if(!m||it.posicao==="ensaio")return [];const w=[];
  const cs=C.cur.cant.filter(x=>x.item_id===it.id).map(x=>x.integrante_id),ms=C.cur.mus.filter(x=>x.item_id===it.id);
  const learning=(id,k)=>S.apr.some(a=>a.musica_id===m.id&&a.integrante_id===id&&a.instrumento===k&&["nova","em_aprendizagem"].includes(a.status));
  cs.forEach(id=>{const n=nmOf(S.integ,id);if(!S.habil.some(h=>h.musica_id===m.id&&h.integrante_id===id))w.push(`${n} não está habilitado(a) nesta música.`);if(learning(id,"voz"))w.push(`${n} ainda está aprendendo esta música (voz).`)});
  ms.forEach(x=>{const n=nmOf(S.integ,x.integrante_id),k=INS[x.instrumento].toLowerCase();if(!S.hab.some(h=>h.integrante_id===x.integrante_id&&h.instrumento===x.instrumento))w.push(`${n} não tem ${k} cadastrado.`);if(learning(x.integrante_id,x.instrumento))w.push(`${n} ainda está aprendendo ${k} nesta música.`)});
  const cnt={};ms.forEach(x=>cnt[x.integrante_id]=(cnt[x.integrante_id]||0)+1);
  Object.entries(cnt).filter(([,n])=>n>1).forEach(([id])=>w.push(`${nmOf(S.integ,id)} está em mais de um instrumento.`));
  const p=prioOf(m.id);if(p&&!lib(p)&&!cs.includes(p.integrante_id))w.push(`Música inédita com prioridade de ${nmOf(S.integ,p.integrante_id)}.`);
  return w;
}
function slotH(it,ed){
  const [lab,cat]=POS[it.posicao],cs=C.cur.cant.filter(x=>x.item_id===it.id).map(x=>x.integrante_id),dis=ed?"":"disabled";
  const songsO=srt(S.mus.filter(s=>!cat||s.categoria===cat)).map(s=>{const p=prioOf(s.id),lk=p&&!lib(p)?` — prioridade: ${nmOf(S.integ,p.integrante_id)}`:"";return `<option value="${s.id}"${s.id===it.musica_id?" selected":""}>${esc(s.nome+lk)}</option>`}).join("");
  const head=`<div class="sl-h"><strong>${lab}</strong>${cat?`<span class="bd ${cat==="jubilo"?"blu":"pnk"}">${CAT[cat]}</span>`:""}${ed&&["adoracao2","adoracao_pos","ensaio"].includes(it.posicao)?`<button class="btn-i" data-act="delitem" data-id="${it.id}" aria-label="Remover posição">${ic("trash")}</button>`:""}</div>`;
  const song=`<select class="field" data-it="${it.id}" data-f="musica_id" ${dis}><option value="">Selecionar música…</option>${songsO}</select>`;
  if(it.posicao==="ensaio")return `<div class="slot">${head}${song}<input class="field" data-it="${it.id}" data-f="observacoes" placeholder="Observações" value="${esc(it.observacoes)}" ${dis}></div>`;
  const singers=S.integ.filter(i=>i.ativo&&i.eh_cantor).map(i=>`<button class="chip${cs.includes(i.id)?" on":""}" ${ed?`data-act="cant" data-it="${it.id}" data-in="${i.id}"`:"disabled"}>${esc(i.nome)}</button>`).join("");
  const mus=INSTR.map(k=>{const cur=C.cur.mus.find(x=>x.item_id===it.id&&x.instrumento===k),o=S.integ.filter(i=>i.ativo&&i.eh_instrumentista).map(i=>{const h=S.hab.find(h=>h.integrante_id===i.id&&h.instrumento===k);return `<option value="${i.id}"${cur&&cur.integrante_id===i.id?" selected":""}>${esc(i.nome+(h?" ("+NIV[h.nivel].toLowerCase()+")":""))}</option>`}).join("");return `<label class="mi"><span>${INS[k]}</span><select class="field" data-it="${it.id}" data-mi="${k}" ${dis}><option value="">—</option>${o}</select></label>`}).join("");
  const w=warns(it);
  return `<div class="slot">${head}${song}<label class="mi"><span>Tom nesta apresentação</span><select class="field" data-it="${it.id}" data-f="tom" ${dis}>${KO.map(([k,l])=>`<option value="${k}"${(it.tom||"")===k?" selected":""}>${l}</option>`).join("")}</select></label><div class="fg" style="margin:0"><span class="fl">Cantores</span><div class="chips">${singers||`<span class="fl">Nenhum cantor cadastrado.</span>`}</div></div><div class="mgrid">${mus}</div><input class="field" data-it="${it.id}" data-f="observacoes" placeholder="Observações para este culto" value="${esc(it.observacoes)}" ${dis}>${w.map(x=>`<div class="warn">⚠ ${esc(x)}</div>`).join("")}</div>`;
}
function editor(){
  const {c,items}=C.cur,ed=S.admin&&c.status!=="cancelada",st=c.status;
  const b=(s,l,w)=>`<button class="${w?"white":"ghost"}" data-act="cstat" data-s="${s}">${l}</button>`;
  const acts=!S.admin?"":st==="rascunho"?b("finalizada","Finalizar escala",1)+b("cancelada","Cancelar"):st==="finalizada"?b("realizada","Marcar como realizada",1)+b("rascunho","Voltar para rascunho")+b("cancelada","Cancelar"):st==="realizada"?b("finalizada","Reabrir"):b("rascunho","Reativar");
  let body=items.map(it=>slotH(it,ed)).join("");
  if(c.tipo==="ensaio"){
    const sg=[...new Set(S.apr.filter(a=>a.status!=="dominada").map(a=>a.musica_id))].filter(id=>byId(S.mus,id)&&!items.some(i=>i.musica_id===id));
    body+=ed?`<div class="card"><div class="row2"><button class="ghost" data-act="addens">${ic("plus")} Adicionar música</button></div>${sg.length?`<span class="fl">Sugeridas da aprendizagem</span><div class="chips" style="margin-top:8px">${sg.map(id=>`<button class="chip" data-act="sug" data-id="${id}">${esc(nmOf(S.mus,id))}</button>`).join("")}</div>`:""}</div>`:"";
  }else{
    const miss=["adoracao2","adoracao_pos"].filter(p=>!items.some(i=>i.posicao===p));
    if(ed&&miss.length)body+=`<div class="row2"><button class="ghost" data-act="addpos">${ic("plus")} Adicionar posição</button></div>`;
  }
  return {t:"Escala",a:`<button class="ghost" data-act="back">Voltar</button>`,h:`<div class="card"><div class="eh"><div><strong>${esc(c.titulo||(c.tipo==="ensaio"?"Ensaio":"Culto"))}</strong><small>${D(c.data).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})} · ${hh(c.hora)}</small></div><span class="bd ${st==="realizada"?"grn":st==="finalizada"?"blu":st==="cancelada"?"pnk":"yel"}">${STU[st]}</span></div><div class="row2">${acts}</div></div>${items.length?body:`<div class="empty">Nenhuma posição neste compromisso.</div>`}`};
}

  const c=byId(S.comps,el.dataset.id),v=await form(`Publicar "${c.titulo}"`,[{k:"c",l:"Categoria na biblioteca",t:"select",o:Object.entries(CAT),req:1}],{c:"jubilo"},{ok:"Publicar"});if(!v)return;
  await chk(sb.rpc("lv_publicar_composicao",{p_composicao:c.id,p_categoria:v.c}));
  const [a,b]=await Promise.all([chk(T("composicoes").select("*").order("atualizado_em",{ascending:false})),chk(T("musicas").select("*").order("nome"))]);S.comps=a.data;S.mus=b.data;render();toast("Composição publicada na biblioteca");
};
A.apadd=async()=>{
  const v=await form("Nova aprendizagem",[{k:"m",l:"Música",t:"select",o:srt([...S.mus]).map(m=>[m.id,m.nome]),req:1},{k:"i",l:"Integrante",t:"select",o:intO(),req:1},{k:"k",l:"Instrumento",t:"select",o:Object.entries(INS)},{k:"s",l:"Situação",t:"select",o:Object.entries(STA)}],{k:"violao",s:"nova"});if(!v)return;
  const {data}=await chk(T("aprendizagem").insert({musica_id:v.m,integrante_id:v.i,instrumento:v.k,status:v.s}).select().single());S.apr.push(data);render();
};
A.apdel=async el=>{await chk(T("aprendizagem").delete().eq("id",el.dataset.id));S.apr=S.apr.filter(a=>a.id!==el.dataset.id);render()};
A.nint=()=>editInt(null);
A.eint=el=>editInt(byId(S.integ,el.dataset.id));
async function editInt(i){
  const d={ativo:true,...(i||{})};S.hab.filter(h=>i&&h.integrante_id===i.id).forEach(h=>d["h_"+h.instrumento]=h.nivel);
  const v=await form(i?"Editar integrante":"Novo integrante",intFields(),d);if(!v)return;
  const row={nome:v.nome,email:v.email||null,aniversario:v.aniversario||null,eh_cantor:v.eh_cantor,eh_instrumentista:v.eh_instrumentista,ativo:v.ativo,observacoes:v.observacoes||null};
  const {data}=await chk(i?T("integrantes").update(row).eq("id",i.id).select().single():T("integrantes").insert(row).select().single());
  const hs=Object.keys(INS).filter(k=>v["h_"+k]).map(k=>({integrante_id:data.id,instrumento:k,nivel:v["h_"+k]}));
  await chk(T("habilidades").delete().eq("integrante_id",data.id));if(hs.length)await chk(T("habilidades").insert(hs));
  const j=S.integ.findIndex(x=>x.id===data.id);if(j>=0)S.integ[j]=data;else S.integ.push(data);srt(S.integ);
  S.hab=S.hab.filter(h=>h.integrante_id!==data.id).concat(hs);render();toast("Integrante salvo");
}
const agF=()=>[{k:"titulo",l:"Título",req:1},{k:"dia",l:"Dia da semana",t:"select",o:DN.map((n,i)=>[String(i),n])},{k:"hora",l:"Horário",t:"time",req:1},{k:"tipo",l:"Tipo",t:"select",o:[["culto","Culto"],["ensaio","Ensaio"]]},{k:"ativo",l:"Ativo",t:"check"}];
async function editAg(g){
  const v=await form(g?"Editar horário":"Novo horário",agF(),g?{titulo:g.titulo,dia:String(g.dia_semana),hora:hh(g.hora),tipo:g.tipo,ativo:g.ativo}:{dia:"0",tipo:"culto",ativo:true},{del:!!g});if(!v)return;
  if(v.__del){await chk(T("agenda_fixa").delete().eq("id",g.id));S.agenda=S.agenda.filter(x=>x.id!==g.id)}
  else{const row={titulo:v.titulo,dia_semana:Number(v.dia),hora:v.hora,tipo:v.tipo,ativo:v.ativo};const {data}=await chk(g?T("agenda_fixa").update(row).eq("id",g.id).select().single():T("agenda_fixa").insert(row).select().single());const j=S.agenda.findIndex(x=>x.id===data.id);if(j>=0)S.agenda[j]=data;else S.agenda.push(data);S.agenda.sort((a,b)=>a.dia_semana-b.dia_semana||hh(a.hora).localeCompare(hh(b.hora)))}
  render();
}
A.nag=()=>editAg(null);A.eag=el=>editAg(byId(S.agenda,el.dataset.id));
A.mprev=()=>{C.m--;if(C.m<0){C.m=11;C.y--}render()};
A.mnext=()=>{C.m++;if(C.m>11){C.m=0;C.y++}render()};
A.day=el=>{
  const k=el.dataset.d,es=evs(k,k);
  view(`<h3>${D(k).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</h3><div class="list">${es.length?es.map(e=>`${evRow(e)}${S.admin&&e.status!=="cancelada"?`<div class="row2" style="margin-top:-2px"><button class="ghost" data-act="cancelev" data-d="${e.data}" data-h="${e.hora}" data-t="${e.tipo}">Cancelar este dia</button></div>`:""}`).join(""):`<div class="empty">Nada agendado neste dia.</div>`}</div>${S.admin?`<div class="row2"><button class="ghost" data-act="avulso" data-d="${k}">${ic("plus")} Culto ou ensaio avulso</button></div>`:""}`);
};
const findEv=el=>evs(el.dataset.d,el.dataset.d).find(e=>e.hora===el.dataset.h&&e.tipo===el.dataset.t);
A.openev=async el=>{
  let e=findEv(el);if(!e)return;
  if(!e.id){if(!S.admin){toast("A escala deste dia ainda não foi montada.");return}e=await mkCulto(e)}
  $("dlgV").close();await openC(byId(S.cultos,e.id)||e);
};
A.cancelev=async el=>{
  const e=findEv(el);if(!e)return;
  if(e.id)await chk(T("cultos").update({status:"cancelada"}).eq("id",e.id));else await mkCulto(e,"cancelada");
  await reloadCultos();$("dlgV").close();render();toast("Dia cancelado");
};
A.avulso=async el=>{
  const v=await form("Culto ou ensaio avulso",[{k:"titulo",l:"Título",req:1},{k:"data",l:"Data",t:"date",req:1},{k:"hora",l:"Horário",t:"time",req:1},{k:"tipo",l:"Tipo",t:"select",o:[["culto","Culto"],["ensaio","Ensaio"]]}],{data:(el&&el.dataset&&el.dataset.d)||TODAY(),tipo:"culto"});if(!v)return;
  const c=await mkCulto(v);$("dlgV").close();await openC(c);
};
A.back=()=>{C.cur=null;render()};
A.cstat=async el=>{
  const c=C.cur.c,s=el.dataset.s;
  if(s==="realizada"&&c.tipo==="culto"){
    const its=C.cur.items.filter(i=>i.musica_id);if(!its.length){toast("Escolha ao menos uma música antes de registrar.");return}
    const v=await form("Quais músicas foram cantadas?",[{k:"ids",l:"Marque as que foram cantadas",t:"chips",o:its.map(i=>[i.id,`${POS[i.posicao][0]}: ${nmOf(S.mus,i.musica_id)}`])}],{ids:its.map(i=>i.id)},{ok:"Registrar culto"});if(!v)return;
    await chk(sb.rpc("lv_realizar_culto",{p_culto:c.id,p_cantadas:v.ids}));await reloadPrio();toast("Culto registrado no histórico");
  }else await chk(T("cultos").update({status:s}).eq("id",c.id));
  await reloadC();
};
A.addpos=async()=>{
  const miss=["adoracao2","adoracao_pos"].filter(p=>!C.cur.items.some(i=>i.posicao===p));
  const v=await form("Adicionar posição",[{k:"p",l:"Posição",t:"select",o:miss.map(p=>[p,POS[p][0]])}]);if(!v)return;
  await chk(T("culto_itens").insert({culto_id:C.cur.c.id,ordem:POS[v.p][2],posicao:v.p}));await reloadC();
};
A.delitem=async el=>{await chk(T("culto_itens").delete().eq("id",el.dataset.id));await reloadC()};
A.addens=async()=>{const mx=Math.max(0,...C.cur.items.map(i=>i.ordem));await chk(T("culto_itens").insert({culto_id:C.cur.c.id,ordem:mx+1,posicao:"ensaio"}));await reloadC()};
A.sug=async el=>{const mx=Math.max(0,...C.cur.items.map(i=>i.ordem));await chk(T("culto_itens").insert({culto_id:C.cur.c.id,ordem:mx+1,posicao:"ensaio",musica_id:el.dataset.id}));await reloadC()};
A.cant=async el=>{
  const item_id=el.dataset.it,integrante_id=el.dataset.in,has=C.cur.cant.some(x=>x.item_id===item_id&&x.integrante_id===integrante_id);
  if(has){await chk(T("item_cantores").delete().eq("item_id",item_id).eq("integrante_id",integrante_id));C.cur.cant=C.cur.cant.filter(x=>!(x.item_id===item_id&&x.integrante_id===integrante_id))}
  else{await chk(T("item_cantores").insert({item_id,integrante_id}));C.cur.cant.push({item_id,integrante_id})}
  render();
};

/* alterações em campos (autosave) */
document.addEventListener("change",async e=>{
  const el=e.target;
  try{
    if(el.dataset.lf){const k=el.dataset.lf;if(k==="api")AP.i=el.value;else if(k==="aps")AP.s=el.value;else L[k]=el.value;if(V==="aprendizagem")render();else if($("songs"))$("songs").innerHTML=songs();return}
    if(el.dataset.hp){HP=Number(el.value);render();return}
    if(el.dataset.sd){SD.tom=el.value;showSong();return}
    if(el.dataset.ap){await chk(T("aprendizagem").update({status:el.value}).eq("id",el.dataset.ap));byId(S.apr,el.dataset.ap).status=el.value;toast("Situação atualizada");return}
    const id=el.dataset.it;if(!id||!C.cur)return;const it=C.cur.items.find(x=>x.id===id);
    if(el.dataset.f){
      const f=el.dataset.f,patch={[f]:el.value||null};
      if(f==="musica_id"){const m=byId(S.mus,el.value);patch.tom=m?(m.tom_ministerio||m.tom_original||null):null}
      await chk(T("culto_itens").update(patch).eq("id",id));Object.assign(it,patch);render();
    }else if(el.dataset.mi){
      const k=el.dataset.mi;C.cur.mus=C.cur.mus.filter(x=>!(x.item_id===id&&x.instrumento===k));
      if(el.value){const r={item_id:id,instrumento:k,integrante_id:el.value};await chk(T("item_musicos").upsert(r));C.cur.mus.push(r)}
      else await chk(T("item_musicos").delete().eq("item_id",id).eq("instrumento",k));
      render();
    }
  }catch(x){fail(x)}
});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset.lf==="q"){L.q=el.value;if($("songs"))$("songs").innerHTML=songs()}});

/* ---------- login ---------- */
$("fAuth").onsubmit=async e=>{
  e.preventDefault();$("authErr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("inEmail").value.trim(),password:$("inPass").value});
  if(error)$("authErr").textContent="E-mail ou senha incorretos.";
};
async function enter(session){
  if(!session){user=null;S.admin=false;document.body.classList.add("locked");document.body.classList.remove("boot");return}
  if(user&&user.id===session.user.id)return;
  user=session.user;
  const ok=await loadAll();
  if(!ok){const bad=!S.admin&&!S.me;user=null;await sb.auth.signOut();if(bad)$("authErr").textContent="Sua conta não está vinculada ao ministério. Peça ao administrador para vinculá-la.";return}
  document.body.classList.remove("locked","boot");go("painel");
}
sb.auth.onAuthStateChange((ev,session)=>setTimeout(()=>enter(session),0));
sb.auth.getSession().then(({data})=>enter(data.session));
buildNav();
})();
</script>
